[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mintfig"
version = "0.3.3"
description = "Message-first figures for agents explaining scientific results to people, plus journal-ready plates with preflight QA and reproducible bundles."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ben Blaiszik" }]
keywords = ["matplotlib", "scientific figures", "data visualization", "agents", "publication"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "matplotlib>=3.8",
    "numpy>=1.24",
    "pillow>=10.0",
]

[project.optional-dependencies]
chip = [
    "mintchip>=0.2",
]
pub = [
    "pypdf>=4.0",
]
all = [
    "mintfig[pub,chip]",
]
dev = [
    "pypdf>=4.0",
    "pytest>=8.0",
    "ruff>=0.4",
]

[project.urls]
Homepage = "https://github.com/blaiszik/mintfig"
Documentation = "https://github.com/blaiszik/mintfig#readme"
Repository = "https://github.com/blaiszik/mintfig"
Issues = "https://github.com/blaiszik/mintfig/issues"
Changelog = "https://github.com/blaiszik/mintfig/blob/main/CHANGELOG.md"

[project.scripts]
mintfig = "mintfig.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mintfig"]
artifacts = ["src/mintfig/assets/*.md", "src/mintfig/assets/references/*.md"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "CHANGELOG.md", "LICENSE", "pyproject.toml"]
artifacts = ["src/mintfig/assets/*.md", "src/mintfig/assets/references/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["gallery/output", "evals/output"]
