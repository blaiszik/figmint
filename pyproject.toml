[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "figmint"
version = "0.2.0"
description = "Message-first figures for agents explaining scientific results to people, plus journal-ready plates with preflight QA and reproducible bundles."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ben Blaiszik" }]
keywords = ["matplotlib", "scientific figures", "data visualization", "agents", "publication"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "matplotlib>=3.8",
    "numpy>=1.24",
    "pillow>=10.0",
    "pypdf>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[project.urls]
Repository = "https://github.com/blaiszik/figmint"

[project.scripts]
figmint = "figmint.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/figmint"]
artifacts = ["src/figmint/assets/*.md"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE", "pyproject.toml"]
artifacts = ["src/figmint/assets/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
