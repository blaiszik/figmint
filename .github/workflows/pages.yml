name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "evals/figure_bench/site/**"
      - "gallery/output/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Stage Pages site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site/gallery
          cp evals/figure_bench/site/index.html _site/index.html
          if [ -d gallery/output ]; then
            find gallery/output -maxdepth 2 -name '*.html' -exec cp {} _site/gallery/ \;
          fi
          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
